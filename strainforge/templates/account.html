{% extends "base.html" %}
{% block title %}Account · Strainforge{% endblock %}
{% block body %}
<div class="authwrap" style="max-width:520px">
  <div class="panel">
    <h1>Your account</h1>
    <p class="sub">{{ s.email }}</p>
    <form method="post" action="/account/name" class="form-grid" style="margin-top:16px">
      <label>Name <span class="hint">Shown to your team next to the calculations you save</span><input name="full_name" value="{{ s.name }}" maxlength="80" required></label>
      <button class="btn" type="submit" style="justify-self:start">Save name</button>
    </form>
  </div>
  <div class="panel" style="margin-top:18px">
    <h2>Change password</h2>
    <form method="post" action="/account/password" class="form-grid" style="margin-top:12px">
      <label>Current password<input type="password" name="current" autocomplete="current-password" required></label>
      <label>New password <span class="hint">At least 8 characters</span><input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary" type="submit" style="justify-self:start">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
